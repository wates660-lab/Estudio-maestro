<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0a09">
  <meta name="format-detection" content="telephone=no">
  <title>Estudio Maestro: Sabotaje en Producción</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230e0d0c' width='32' height='32'/%3E%3Crect x='4' y='6' width='24' height='6' fill='%23f2a33a'/%3E%3Crect x='4' y='14' width='24' height='14' fill='none' stroke='%23ece3d0' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="sin-hud">
  <div id="grano" aria-hidden="true"></div>
  <div id="vineta" aria-hidden="true"></div>
  <div id="corte" aria-hidden="true"></div>
  <div id="app">
    <header id="hud" hidden>
      <p class="marca">EM</p>
      <p id="hud-ronda"></p>
      <div class="medidor" data-m="presupuesto">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.5v11M15 9.2c-.6-1-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3.1 6.2 1.4 6.2 4.4 0 1.3-1.4 2.2-3.2 2.2-1.4 0-2.6-.6-3.2-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="etq">Presupuesto</span><span class="val"></span><div class="barra"><div class="lleno"></div></div>
      </div>
      <div class="medidor" data-m="moral">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="9.5" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3.6 2.7-5.6 6-5.6s6 2 6 5.6M16 14.6c2.8 0 5 1.6 5 4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="etq">Moral</span><span class="val"></span><div class="barra"><div class="lleno"></div></div>
      </div>
      <div class="medidor" data-m="tiempo">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.5V12l3.8 2.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="etq">Tiempo</span><span class="val"></span><div class="barra"><div class="lleno"></div></div>
      </div>
      <div class="medidor" data-m="calidad">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1L12 17l-5.5 2.9 1.2-6.1L3.2 9.6l6.1-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="etq">Calidad</span><span class="val"></span><div class="barra"><div class="lleno"></div></div>
      </div>
      <button type="button" id="btn-diccionario">Conceptos</button>
      <button type="button" id="btn-evidencias">Evidencias</button>
      <button type="button" id="btn-sonido" aria-pressed="false">Sonido</button>
    </header>
    <div id="vista"></div>
  </div>
  <div id="popover-sonido" hidden>
    <label><span>Música</span> <input id="vol-musica" type="range" min="0" max="100" value="55"></label>
    <label><span>Voz</span> <input id="vol-voz" type="range" min="0" max="100" value="100"></label>
    <button type="button" id="btn-mudo" class="btn">Silencio</button>
  </div>
  <div id="capa-evidencias" hidden></div>
  <div id="capa-demo" hidden></div>
  <div id="capa-diccionario" hidden></div>
  <div id="girar" role="alert">
    <div class="girar-tel" aria-hidden="true"></div>
    <p class="girar-t">Gira tu celular</p>
    <p class="girar-s">Estudio Maestro se juega en horizontal.</p>
  </div>
  <script src="js/tactil.js"></script>
  <script src="js/datos_guion.js"></script>
  <script src="js/voz_tiempos.js"></script>
  <script src="js/datos_juego.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/narradora.js"></script>
  <script src="js/escenas.js"></script>
  <script src="js/minijuegos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/final.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/autoprueba.js"></script>
  <script src="js/juego.js"></script>
</body>
</html>
